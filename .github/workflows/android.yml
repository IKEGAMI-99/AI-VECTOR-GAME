name: Android CI + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -Fxq "classes.dex" /tmp/apk-files.txt
          grep -Fxq "lib/arm64-v8a/libai_vector_native.so" /tmp/apk-files.txt
          grep -Fxq "res/mipmap-anydpi-v26/ic_launcher.xml" /tmp/apk-files.txt
          rm -rf /tmp/apk-check
          mkdir -p /tmp/apk-check
          unzip -q "$APK" "lib/arm64-v8a/libai_vector_native.so" -d /tmp/apk-check
          NATIVE="/tmp/apk-check/lib/arm64-v8a/libai_vector_native.so"
          readelf -Ws "$NATIVE" | grep -q "Java_com_aivectorgame_app_ai_NativeEngine_nativePredictTopTokens"
          readelf -Ws "$NATIVE" | grep -q "Java_com_aivectorgame_app_ai_NativeEngine_nativeEmbedding"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare named APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "AI-VECTOR-GAME-v${{ steps.version.outputs.version }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-vector-game-v${{ steps.version.outputs.version }}-release
          path: AI-VECTOR-GAME-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="AI-VECTOR-GAME-v${{ steps.version.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "AI VECTOR GAME $TAG" \
              --generate-notes
          fi
