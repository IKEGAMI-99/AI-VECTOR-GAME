name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -Fxq "classes.dex" /tmp/apk-files.txt
          grep -Fxq "lib/arm64-v8a/libai_vector_native.so" /tmp/apk-files.txt
          grep -Fxq "res/mipmap-anydpi-v26/ic_launcher.xml" /tmp/apk-files.txt
          rm -rf /tmp/apk-check
          mkdir -p /tmp/apk-check
          unzip -q "$APK" "lib/arm64-v8a/libai_vector_native.so" -d /tmp/apk-check
          NATIVE="/tmp/apk-check/lib/arm64-v8a/libai_vector_native.so"
          readelf -Ws "$NATIVE" | grep -q "Java_com_aivectorgame_app_ai_NativeEngine_nativePredictTopTokens"
          readelf -Ws "$NATIVE" | grep -q "Java_com_aivectorgame_app_ai_NativeEngine_nativeEmbedding"
          sha256sum "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-vector-game-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
